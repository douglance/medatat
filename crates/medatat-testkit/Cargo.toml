[package]
name = "medatat-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The unit-test harness has no benchmarks of its own, and `cargo bench` would otherwise
# run it and reject criterion's arguments before reaching the real benches.
[lib]
bench = false

# Dev-dependency only. Generates SYNTHETIC data exclusively -- no real PHI ever enters
# this system. See docs/12-PHI-READINESS.md.
[dependencies]
medatat-core = { workspace = true }
chrono       = { workspace = true }
rust_decimal = { workspace = true }
uuid         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }

[dev-dependencies]
medatat-store = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bench1_load"
harness = false

[[bench]]
name = "bench2_save"
harness = false

[[bench]]
name = "bench3_instance"
harness = false

[[bench]]
name = "bench4_scale"
harness = false

[[bench]]
name = "bench5_caseload"
harness = false

# Diagnostic, not a gate: no-ops unless MEDATAT_CHECKPOINT_PROBE is set, so it costs
# `cargo bench` nothing while staying reproducible for anyone who wants the numbers.
[[bench]]
name = "bench6_checkpoint"
harness = false

# `phi` here only forwards to the crates under test, so `cargo bench --features phi`
# measures the SQLCipher path (docs/12-PHI-READINESS.md item 9).
[features]
default = []
phi = ["medatat-core/phi", "medatat-store/phi"]
