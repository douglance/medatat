# medatat CI.
#
# This workflow is the enforcement AGENTS.md describes. Every gate listed under
# "Before you commit" has a job here, and the two traps that make a green
# `cargo test` misleading each have their own job:
#
#   - half of `medatat-worker` is behind `#[cfg(target_arch = "wasm32")]`, so
#     native tests do not compile `routes/`, `store/`, or `case_do.rs` at all
#     -> the `wasm` job cross-compiles it
#   - a green wasm32 compile is necessary but not sufficient, because the
#     bundle step runs wasm-bindgen separately and can fail on its own
#     -> the `wasm` job bundles the Worker, the real gate
#
# Shape follows docs/07-TESTING.md "CI pipeline".
#
# The Worker bundles with `--profile release-wasm`, NOT `--release`. Measured
# cause of `externref table required for catch wrappers`: `[profile.release]`
# sets `strip = true` (i.e. strip = "symbols"), which removes the externref
# table wasm-bindgen needs for its catch wrappers. release-wasm inherits
# release and turns strip off. Bisected against the alternatives: clearing
# RUSTFLAGS does not fix it, and `panic = "abort"` is not involved.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Cargo shells out to `git` instead of using its own transport. Without this a
  # cold job spends minutes cloning ~1 GB of Zed history for GPUI.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # --------------------------------------------------------------------------
  # Can this workspace even resolve on a machine that is not the author's?
  # Cheap, fails fast, and gives one clear message instead of six confusing ones.
  # --------------------------------------------------------------------------
  preflight:
    name: preflight (workspace resolves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject absolute path dependencies
        run: |
          # A `path = "/..."` dependency resolves only on the machine it was
          # written on. Cargo resolves the whole workspace graph even for
          # `cargo build -p <one-crate>`, so a single one of these fails every
          # job in this file, not just the crate that declares it.
          if grep -rnE '^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=.*\bpath[[:space:]]*=[[:space:]]*"/' \
               Cargo.toml crates/*/Cargo.toml xtask/Cargo.toml; then
            echo "::error::Absolute path dependency found (see above). CI runs on a clean \
          checkout, so this path does not exist. Vendor the crate into the repo, publish it, \
          or use a git dependency pinned by rev."
            exit 1
          fi

      - name: Resolve the dependency graph
        run: cargo metadata --format-version 1 --locked > /dev/null

  # --------------------------------------------------------------------------
  # fmt, clippy, and the R15 no-spinner lint.
  # --------------------------------------------------------------------------
  check:
    name: check (fmt, clippy, lint-no-spinner)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - name: Install the pinned toolchain
        # rust-toolchain.toml pins 1.96.1 with rustfmt, clippy, and the wasm32
        # target. Letting rustup read it keeps CI and developers on one version.
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # R15: no spinner, progress bar, skeleton, shimmer, or "Loading…" in medatat-ui.
      - run: cargo run -p xtask -- lint-no-spinner

  # --------------------------------------------------------------------------
  # The main test matrix. Windows and Linux are the only way we ever learn
  # whether they work — ADR-0003 currently admits they are untested.
  # --------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        # Must run before checkout: the Zed dependency tree has paths that
        # exceed the legacy 260-character limit.
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        # GPUI needs a Vulkan ICD even for the three #[gpui::test] cases, and a
        # CI runner has no GPU. lavapipe is the software ICD.
        env:
          VK_ICD_FILENAMES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.x86_64.json' || '' }}
        run: cargo test --workspace

  # --------------------------------------------------------------------------
  # The PHI path. This is the job that matters most: `phi` is off by default, so
  # nothing else in this file compiles it, and AGENTS.md invariant 11 requires it
  # to keep working so that turning PHI on later stays a switch, not a project.
  # --------------------------------------------------------------------------
  phi:
    # M8 asks for `--features phi` clean on all three platforms, so it is checked on all
    # three rather than asserted from one. `phi` turns on rusqlite/bundled-sqlcipher, which
    # compiles SQLCipher from source and links OpenSSL -- the part most likely to behave
    # differently per platform, and the reason this is a matrix and not a note.
    name: phi (feature build + test)
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo build --workspace --features phi

      - name: Test with PHI protections on
        env:
          # Software Vulkan, for the headless GPUI tests. Linux only -- macOS and Windows
          # have their own working backend and this variable would point at nothing.
          VK_ICD_FILENAMES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.x86_64.json' || '' }}
        run: cargo test --workspace --features phi

  # --------------------------------------------------------------------------
  # The Worker. `cargo test -p medatat-worker` says almost nothing about
  # routes/, store/, and case_do.rs, and a green wasm32 compile still does not
  # prove the bundle links. Both are gates here.
  # --------------------------------------------------------------------------
  wasm:
    name: wasm (cross-compile + worker-build)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cross-compile the Worker
        # Necessary but NOT sufficient — see the bundle step below.
        run: cargo build -p medatat-worker --target wasm32-unknown-unknown

      - name: Cache worker-build
        id: worker-build-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-v0.8.5

      - name: Install worker-build
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install --locked worker-build

      - name: Bundle the Worker
        # THE gate for this crate. wasm-bindgen runs here and can fail on its
        # own — observed: `externref table required for catch wrappers`.
        # `--profile release-wasm` is required: see the note at the top of this
        # file and the profile comment in Cargo.toml.
        working-directory: crates/medatat-worker
        run: worker-build --profile release-wasm

      - name: Report bundle size
        # M1 criterion (b): compressed bundle under 10 MB, so the number has to
        # be answerable from a CI run rather than someone's laptop.
        working-directory: crates/medatat-worker
        run: |
          limit=$((10 * 1024 * 1024))
          status=0
          {
            echo "### Worker bundle size"
            echo
            echo "| Artifact | Raw | Gzipped |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r wasm; do
            raw=$(wc -c < "$wasm")
            gz=$(gzip -9 -c "$wasm" | wc -c)
            echo "| \`$(basename "$wasm")\` | $raw B | $gz B |" >> "$GITHUB_STEP_SUMMARY"
            echo "$wasm: raw=${raw}B gzip=${gz}B (limit ${limit}B)"
            if [ "$gz" -gt "$limit" ]; then
              echo "::error::$(basename "$wasm") is ${gz} B gzipped, over the 10 MB Workers limit"
              status=1
            fi
          done < <(find build -name '*.wasm' -type f)
          exit $status

  # --------------------------------------------------------------------------
  # Benches 1 and 2 assert their own thresholds and fail the process on regression.
  # Bench 3 measures open-to-paint but asserts nothing (two of its four spans live in
  # medatat-ui, so it cannot gate from medatat-testkit). Bench 4 is still a stub.
  # Bench 4 is a placeholder that registers an empty group.
  #
  # NEVER relax a threshold to make this pass. A red bench is the failure being
  # reported, not the obstacle to fixing it.
  # --------------------------------------------------------------------------
  bench:
    name: bench (R13, R14 gates)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo bench -p medatat-testkit

  # --------------------------------------------------------------------------
  # The desktop build on all three platforms. ADR-0003 admits Windows and Linux
  # are untested; this job is the only thing that will ever change that.
  # --------------------------------------------------------------------------
  gpui-build:
    name: gpui-build (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo build -p medatat-ui

  # --------------------------------------------------------------------------
  # scripts/smoke.sh against `wrangler dev --local`.
  #
  # Verified locally on macOS: all 13 checks pass on both code paths, repeatably.
  # NOT verified on an ubuntu runner — see the note on the wrangler pin below.
  #
  # Every step below either succeeds or fails with a message naming what broke.
  # That is deliberate: the bug this suite exists to catch was a wrong CLI flag
  # that surfaced fifteen lines later as a bogus assertion failure.
  #
  # Rate limits (3/email, 20/IP per 15 min) never fire here: CI state is fresh
  # and one run makes two auth requests.
  # --------------------------------------------------------------------------
  audit:
    name: audit (cargo audit)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show

      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0

      - name: Install cargo-audit
        # Guarded, not unconditional: `cargo install` refuses with exit 101 when the binary
        # is present but absent from ~/.cargo/.crates.toml, which is exactly what restoring
        # a cache of just the binary produces. The same mistake in wrangler.jsonc's custom
        # build cost this repo two days of red smoke jobs.
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit

      - name: Audit
        # The gate is "no advisory nobody has looked at". Every currently-ignored id is
        # traced and justified in .cargo/audit.toml; anything new fails here.
        run: cargo audit

  smoke:
    name: smoke (end-to-end against wrangler dev)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # wrangler is pinned to the version this job was verified against: an unpinned

      # release can change `kv key get` output or `dev --local` behaviour and turn the

      # job red for reasons unrelated to the code.

      #

      # NOTE: 4.60.0 predates the 4.123.0 that `send_email` needs, so THIS JOB DOES NOT

      # EXERCISE send_email AT ALL. It does not need to -- /auth/request stores the code

      # in KV before it attempts the send, so every assertion here holds with a

      # non-functional mail binding. But do not read a green smoke job as evidence that

      # outbound mail works; nothing in CI covers that path.

      - name: Install wrangler
        # Pinned to the version this was verified against. Unpinned, a wrangler
        # release can change `kv key get` output or `dev --local` behaviour and
        # turn this job red for reasons unrelated to the code under test.
        run: npm install -g wrangler@4.60.0

      - name: Build the CLI
        run: cargo build --release -p medatat-cli

      - name: Create the local D1 schema
        run: |
          wrangler d1 migrations apply medatat --local
          # `migrations apply` reports success when it finds no migrations, so
          # assert the schema actually exists rather than trusting the exit code.
          wrangler d1 execute medatat --local \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='app_user'" \
            | grep -q app_user \
            || { echo "::error::D1 schema was not created — check migrations_dir in wrangler.jsonc"; exit 1; }

      - name: Seed the smoke user
        run: |
          wrangler d1 execute medatat --local --command \
            "INSERT OR REPLACE INTO app_user (user_id,email,display_name,role,is_active,created_at) \
             VALUES ('smoke-user','smoke@cetify.email','Smoke','admin',1,'2026-01-01T00:00:00Z')"

      # Build the Worker bundle BEFORE anything is timing it.
      #
      # `wrangler dev` runs the custom build from wrangler.jsonc, which begins with
      # `cargo install -q worker-build`. On a cold runner that compiles worker-build from
      # source, then builds the wasm, then downloads wasm-opt -- and all of it happened
      # inside the health-check window, which is why this job failed with "did not serve
      # /health within 240s" while the `wasm` job, which caches the binary and builds
      # before it times anything, passed on the same commit.
      #
      # Doing the work here makes wrangler's own build a warm no-op, so the wait below
      # measures the Worker starting rather than the toolchain installing.
      - name: Cache worker-build
        id: worker-build-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-v0.8.5

      - name: Install worker-build
        if: steps.worker-build-cache.outputs.cache-hit != 'true'
        run: cargo install --locked worker-build

      - name: Pre-build the Worker bundle
        run: worker-build --profile release-wasm crates/medatat-worker

      - name: Start the Worker
        run: |
          nohup wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            curl -sf -m 2 http://localhost:8787/health >/dev/null 2>&1 && exit 0
            # A dead wrangler will never serve anything. Waiting out the full window
            # buries the actual error under four minutes of nothing.
            kill -0 "$pid" 2>/dev/null || {
              echo "::error::wrangler dev exited before serving /health"
              tail -50 /tmp/wrangler.log
              exit 1
            }
            sleep 2
          done
          echo "::error::wrangler dev did not serve /health within 240s"
          tail -50 /tmp/wrangler.log
          exit 1

      - name: Seed a form
        env:
          MEDATAT_API: http://localhost:8787
        run: |
          export PATH="$PWD/target/release:$PATH"
          # The corpus needs an admin token, which needs the real auth flow. The
          # code is recovered from LOCAL KV by `medatat dev last-code` — there is
          # no Worker endpoint for it, and the command hardcodes `--local`.
          curl -sf -m 15 -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"email":"smoke@cetify.email"}' http://localhost:8787/auth/request \
            || { echo "::error::/auth/request failed"; exit 1; }
          CODE=$(medatat dev last-code --email smoke@cetify.email) \
            || { echo "::error::could not recover the sign-in code from local KV"; exit 1; }
          TOKEN=$(curl -sf -m 15 -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"smoke@cetify.email\",\"code\":\"$CODE\"}" \
            http://localhost:8787/auth/verify | jq -r '.data.token // empty')
          [ -n "$TOKEN" ] || { echo "::error::/auth/verify returned no token"; exit 1; }
          MEDATAT_TOKEN="$TOKEN" medatat push --cases 1 --fields 20 --batch 5 \
            || { echo "::error::seeding the smoke form failed"; exit 1; }

      - name: Run smoke.sh
        env:
          SMOKE_EMAIL: smoke@cetify.email
        run: |
          export PATH="$PWD/target/release:$PATH"
          # Structural guard: `medatat dev last-code` reads LOCAL emulator state and
          # never reads MEDATAT_API, so pointing this job at a deployed Worker would
          # silently compare a local code against a remote session. Refuse outright.
          TARGET=http://localhost:8787
          case "$TARGET" in
            http://localhost:*|http://127.0.0.1:*) ;;
            *) echo "::error::smoke job must target localhost; got $TARGET"; exit 1 ;;
          esac
          ./scripts/smoke.sh "$TARGET"

      - name: Worker log on failure
        if: failure()
        run: tail -100 /tmp/wrangler.log || true
